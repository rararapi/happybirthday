<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1 class="fade-in">Happy Birthday<br><span id="name"></span></h1>
        <div class="cake-wrapper">
            <img src="birthday-cake.png" alt="Birthday Cake" class="birthday-cake slide-in">
            <div class="candles-container">
                <div class="candle" data-index="0">
                    <div class="flame"></div>
                    <div class="smoke"></div>
                </div>
                <div class="candle" data-index="1">
                    <div class="flame"></div>
                    <div class="smoke"></div>
                </div>
                <div class="candle" data-index="2">
                    <div class="flame"></div>
                    <div class="smoke"></div>
                </div>
            </div>
        </div>
        <div id="confettiContainer"></div>
    </div>
    <div id="messagePopup" class="message-popup"></div>

    <script src="script.js"></script>
    <script type="module" src="three-scene.js"></script>
</body>
</html>
